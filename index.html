<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,Tahoma,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:#000;padding:12px 12px 8px;border-bottom:1px solid #222}.brand{text-align:center;font-size:28px;font-weight:900;margin:3px 0 12px}.brand span{color:#a855f7}
.search{width:100%;height:48px;border-radius:25px;border:1px solid #444;background:#151515;color:#fff;padding:0 18px;outline:0}.chips{display:flex;gap:8px;overflow:auto;padding:10px 2px 2px}.chip{white-space:nowrap;background:#17171b;border:1px solid #333;color:#fff;border-radius:22px;padding:10px 17px}.chip.active{background:#7c3aed}
.feed{padding:10px 8px 100px;columns:2 180px;column-gap:9px}.pin{break-inside:avoid;margin:0 0 10px;background:#151515;border-radius:18px;overflow:hidden;border:1px solid #222;position:relative}.pin img{width:100%;display:block;object-fit:cover;min-height:150px}.meta{padding:10px}.meta h3{margin:0 0 5px;font-size:15px}.meta small{color:#aaa}.heart{position:absolute;top:8px;left:8px;border:0;border-radius:50%;width:38px;height:38px;background:#000b;color:#fff;font-size:20px}.liked .heart{color:#ff2d75}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;height:78px;background:#0e0e10;border-top:1px solid #292929;display:flex;z-index:30}.nav{flex:1;background:none;color:#aaa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav b{font-size:25px;color:#fff}.create{width:54px;height:54px;border-radius:17px;background:#fff;color:#000;font-size:30px}
.sheet{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:flex-end}.sheet.open{display:flex}.panel{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:#151517;border-radius:25px 25px 0 0;padding:20px}.close{float:left;background:#29292d;color:#fff;border-radius:20px;padding:8px 14px}.field{width:100%;padding:14px;border-radius:14px;border:1px solid #3b3b3f;background:#090909;color:#fff;outline:0;margin:7px 0}.primary{width:100%;background:#8b5cf6;color:#fff;padding:14px;border-radius:14px;font-weight:800;margin-top:8px}.secondary{background:#29292d;color:#fff;padding:10px 14px;border-radius:12px}.ai{border:1px solid #6d28d9;background:linear-gradient(135deg,#1b1028,#0c0c0e);padding:16px;border-radius:20px}.ai strong{color:#c084fc}.result{margin-top:12px;padding:12px;border-radius:16px;background:#090909;border:1px solid #29292d}.result img{width:100%;border-radius:14px;margin-top:8px}.profile{text-align:center}.avatar{width:105px;height:105px;border-radius:50%;border:3px solid #a855f7;object-fit:cover}.stats{display:flex;justify-content:space-around;margin:22px 0}.stats b{display:block;font-size:20px}.comment{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #292929}.comment img{width:38px;height:38px;border-radius:50%}.mediaBox{background:#090909;position:relative}.pin video{width:100%;display:block;max-height:520px;object-fit:cover}.pin audio{width:100%;display:block;padding:10px;background:#090909}.mediaLabel{padding:8px 10px;color:#c084fc;font-weight:800;font-size:12px}.viewer{position:relative}.viewer video{width:100%;max-height:65vh;border-radius:16px;background:#000;object-fit:contain}.sheet.video-focus{align-items:center;padding:0;background:#000}.sheet.video-focus .panel{width:100vw;max-width:none;height:100vh;max-height:none;border-radius:0;padding:8px;background:#000;display:flex;flex-direction:column;overflow:hidden}.sheet.video-focus .panel h2{font-size:18px;margin:4px 42px 6px 4px}.sheet.video-focus .viewer{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:#000}.sheet.video-focus .viewer video{width:100%;height:100%;max-height:none;border-radius:0;object-fit:contain}.sheet.video-focus .mediaActions,.sheet.video-focus .zoombar{flex-shrink:0}.sheet.video-focus .close{position:absolute;top:8px;left:8px;z-index:4;background:#000b}.mediaActions{display:flex;gap:7px;flex-wrap:wrap;padding:9px 10px}.mediaActions button{flex:1;min-width:90px}.countLine{display:flex;gap:12px;flex-wrap:wrap;color:#ddd;margin-top:8px;font-size:13px}.downloadBtn{background:#29292d;color:#fff;padding:10px 14px;border-radius:12px;border:0}@keyframes colorFlow{0%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(150deg)}100%{filter:hue-rotate(360deg)}}
.primary,.secondary,.chip,.create,.close,.heart,.nav{transition:transform .18s ease,box-shadow .18s ease,filter .3s ease}.primary,.create{background:linear-gradient(120deg,#6d28d9,#a855f7,#ec4899,#7c3aed);background-size:300% 300%;animation:gradientMove 5s ease infinite,colorFlow 9s linear infinite}.secondary,.chip,.close{background:linear-gradient(120deg,#17171b,#3b1a62,#17171b);background-size:250% 250%;animation:gradientMove 6s ease infinite,colorFlow 12s linear infinite}.nav b{animation:colorFlow 8s linear infinite}.primary:hover,.secondary:hover,.chip:hover,.create:hover,.close:hover{transform:scale(1.03)}@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.stats b{color:#c084fc}.viewCount{color:#aaa}.followCard{margin:12px 10px;padding:14px;border:1px solid #3b1a62;border-radius:18px;background:linear-gradient(135deg,#120b19,#20102f)}.followRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.followBtn{border:0;padding:10px 14px;border-radius:14px;color:#fff;font-weight:800;background:linear-gradient(120deg,#7c3aed,#c084fc,#ec4899);background-size:300% 300%;animation:gradientMove 4s ease infinite,colorFlow 8s linear infinite}

/* V9 passwordless email OTP gate */
#authGate{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto}
#authGate.hidden{display:none}
.authBox{width:min(460px,100%);background:linear-gradient(145deg,#0a0a0c,#17101f);border:1px solid #5420a8;border-radius:28px;padding:24px;box-shadow:0 0 45px #7c3aed55;text-align:center}
.authLogo{width:150px;height:150px;border-radius:34px;object-fit:cover;box-shadow:0 0 35px #7c3aed99;margin:4px auto 16px;display:block}
.authBox h1{margin:4px 0 8px;font-size:28px}.authBox p{color:#aaa;line-height:1.6;margin:8px 0 18px}
.authStep{display:none;text-align:right}.authStep.active{display:block}.authHint{font-size:12px!important;color:#777!important;margin:10px 0!important}
.otp{letter-spacing:10px;text-align:center;font-size:25px;font-weight:900}.authError{color:#ff6b9d!important;min-height:22px;font-weight:700}
.splash{position:fixed;inset:0;z-index:10000;background:#000;display:flex;align-items:center;justify-content:center;animation:splashOut .7s ease 2s forwards;pointer-events:none}
.splash img{width:230px;height:230px;border-radius:48px;box-shadow:0 0 70px #7c3aed;animation:splashPulse 1.4s ease-in-out infinite alternate}
@keyframes splashPulse{from{transform:scale(.96);filter:hue-rotate(0deg)}to{transform:scale(1.03);filter:hue-rotate(35deg)}}@keyframes splashOut{to{opacity:0;visibility:hidden}}

/* V10 auth redesign */
#authGate{padding:18px 16px;background:
 radial-gradient(circle at 50% 15%,#3b0764 0,#170626 18%,#050507 48%,#000 78%);
}
.authBox{position:relative;width:min(430px,100%);padding:28px 22px 24px;border:1px solid #7131d8;
 background:linear-gradient(180deg,rgba(20,10,31,.98),rgba(7,7,10,.99));
 border-radius:30px;box-shadow:0 0 0 1px #a855f722 inset,0 18px 70px #6d28d955;overflow:hidden}
.authBox:before{content:"";position:absolute;inset:-2px;background:linear-gradient(120deg,#6d28d9,#ec4899,#7c3aed,#22d3ee,#6d28d9);
 background-size:300% 300%;animation:gradientMove 7s ease infinite;opacity:.18;filter:blur(18px);z-index:-1}
.authLogo{width:156px;height:156px;border-radius:38px;margin:0 auto 18px;box-shadow:0 0 22px #7c3aed88,0 0 65px #7c3aed44}
.authBox h1{font-size:32px;letter-spacing:.2px;margin:0 0 8px}
.authBox p{font-size:16px;color:#bdb8c7;margin:0 auto 20px;line-height:1.9;max-width:360px}
.authStep{background:#0a090d;border:1px solid #292330;border-radius:20px;padding:14px}
.authStep .field{height:54px;margin:0 0 10px;background:#111016;border-color:#3a3147;font-size:16px}
.authStep .primary{height:54px;margin:0;font-size:16px}
.authStep .secondary{margin-top:10px;width:100%;height:48px}
.authHint{font-size:12px!important;color:#777!important;margin:12px 2px 0!important}
.otp{height:60px!important;font-size:27px!important;letter-spacing:12px!important;background:#0f0c14!important}
.authError{padding:8px 4px 0;min-height:30px;font-size:14px!important}.primary:disabled{opacity:.65;transform:none!important;cursor:wait}
#authConfigNote{display:none!important}
.authBrandLine{display:flex;justify-content:center;align-items:center;gap:7px;color:#8b5cf6;font-weight:800;font-size:13px;margin-bottom:15px}
.authBrandDot{width:7px;height:7px;border-radius:50%;background:#c084fc;box-shadow:0 0 12px #c084fc}
.splash{background:radial-gradient(circle,#160526 0,#000 62%);animation:splashOut .55s ease 1.8s forwards}
.splash img{width:220px;height:220px;border-radius:48px}

<script>
/* Vibe King V13: simple local account — name + birth date only. */
function showAuthError(id,msg){const e=document.getElementById(id);if(e)e.textContent=msg||""}
function createLoginAccount(){
  const name=(document.getElementById("authName").value||"").trim();
  const birth=(document.getElementById("authBirth").value||"").trim();
  showAuthError("authError1","");
  if(name.length<2) return showAuthError("authError1","خطأ: اكتب اسمك بشكل صحيح.");
  if(!birth) return showAuthError("authError1","خطأ: اختر تاريخ ميلادك.");
  const d=new Date(birth+"T00:00:00");
  if(Number.isNaN(d.getTime()) || d>Date.now()) return showAuthError("authError1","خطأ: تاريخ الميلاد غير صحيح.");
  const id="u_"+Date.now()+"_"+Math.random().toString(36).slice(2);
  profile={name,birthDate:birth,email:"",avatar:"",role:"user",id};
  localStorage.setItem("vk_auth_name",name);
  localStorage.setItem("vk_auth_birth",birth);
  localStorage.setItem("vk_auth_id",id);
  localStorage.setItem("vk_auth_role","user");
  localStorage.setItem("vkprofile",JSON.stringify(profile));
  try{
    let arr=JSON.parse(localStorage.getItem("vkaccounts")||"[]");
    if(!Array.isArray(arr)) arr=[];
    arr.push({id,name,email:"",birthDate:birth,avatar:"",role:"user"});
    localStorage.setItem("vkaccounts",JSON.stringify(arr));
  }catch(e){}
  document.getElementById("authGate").classList.add("hidden");
  if(typeof home==='function') home();
}
function bootAuth(){
  try{
    const saved=JSON.parse(localStorage.getItem("vkprofile")||"null");
    if(saved && saved.name && saved.birthDate){ profile=saved; document.getElementById("authGate").classList.add("hidden"); return true; }
  }catch(e){}
  return false;
}
</script>

// Large videos/audio are stored in IndexedDB, not localStorage, so phone storage limits do not break publishing.
const VKDB={name:'VibeKingMediaDB',store:'media'};
let mediaUrls={};
let localMedia={type:'',src:'',mediaId:'',name:''};
function dbOpen(){return new Promise((res,rej)=>{let r=indexedDB.open(VKDB.name,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(VKDB.store))r.result.createObjectStore(VKDB.store,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbPut(blob){let db=await dbOpen(),id='m_'+Date.now()+'_'+Math.random().toString(36).slice(2);await new Promise((res,rej)=>{let tx=db.transaction(VKDB.store,'readwrite');tx.objectStore(VKDB.store).put({id,blob});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();return id}
async function dbGet(id){let db=await dbOpen();let v=await new Promise((res,rej)=>{let r=db.transaction(VKDB.store).objectStore(VKDB.store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return v?.blob||null}
async function dbDel(id){try{let db=await dbOpen();await new Promise((res,rej)=>{let tx=db.transaction(VKDB.store,'readwrite');tx.objectStore(VKDB.store).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){}}
async function hydrateMedia(){for(const p of pins){if(p.mediaId&&!mediaUrls[p.mediaId]){try{let b=await dbGet(p.mediaId);if(b){mediaUrls[p.mediaId]=URL.createObjectURL(b);p.src=mediaUrls[p.mediaId]}}catch(e){}}}render(pins)}

function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1600)}
function home(){document.getElementById("content").innerHTML='<section id="feed" class="feed"></section>';render(pins)}
function render(list){let f=document.getElementById("feed");if(!f)return;f.innerHTML=list.length?list.map((p,i)=>`<article class="pin ${p.liked?"liked":""}"><button class="heart" onclick="like(${i})">♥</button><img src="${p.img||fallback(i)}" onerror="this.src='${fallback(i)}'"><div class="meta"><h3>${esc(p.title)}</h3><small>${esc(p.cat)} · ❤️ ${p.likes}</small><div style="margin-top:8px"><button class="secondary" onclick="comment(${i})">💬</button> <button class="secondary" onclick="savePin(${i})">🔖</button></div></div></article>`).join(""):'<div style="padding:50px;text-align:center;color:#aaa">لا توجد نتائج.<br>جرّب Vibe King ✨</div>'}
function like(i){pins[i].liked=!pins[i].liked;pins[i].likes+=pins[i].liked?1:-1;persist();render(pins)}
function savePin(i){let p=pins[i];if(!p)return;let id=p.id||String(i);if(saved.includes(id)){saved=saved.filter(x=>x!==id);toast("أزيل من المحفوظات")}else{saved.push(id);toast("تم الحفظ 🔖")}localStorage.setItem('vksaved',JSON.stringify(saved));persist();render(pins)}
function comment(i){let arr=comments[pins[i]?.id||i]||[];openSheet(`<button class="close" onclick="closeSheet()">إغلاق</button><h2>💬 التعليقات (${arr.length})</h2><div id="cl">${arr.map(c=>`<div class="comment"><img src="${c.avatar}"><div><b>${esc(c.name)}</b><br>${esc(c.text)}</div></div>`).join("")}</div><input id="cm" class="field" placeholder="اكتب تعليقًا..."><button class="primary" onclick="addComment(${i})">إرسال</button>`)}
function addComment(i){let v=document.getElementById("cm")?.value.trim();if(!v)return;let key=pins[i]?.id||i;comments[key]=comments[key]||[];comments[key].push({name:profile.name,avatar:profile.avatar||"https://i.pravatar.cc/80?img=12",text:v});localStorage.setItem('vkcomments',JSON.stringify(comments));comment(i);toast("تم التعليق")}

function openSheet(h){document.getElementById("panel").innerHTML=h;document.getElementById("sheet").classList.add("open")}function closeSheet(){document.getElementById("sheet").classList.remove("open");document.getElementById("sheet").classList.remove("video-focus");try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch(e){}}
function focusSearch(){document.getElementById("search").focus();toast("اكتب ما تريد")}
function searchPins(q){q=q.toLowerCase().trim();render(!q?pins:pins.filter(p=>(p.title+" "+p.cat).toLowerCase().includes(q)))}
function filter(cat,b){document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(cat==="الكل"?pins:pins.filter(p=>p.cat.includes(cat)))}
function filterByName(cat){let b=[...document.querySelectorAll(".chip")].find(x=>x.textContent.includes(cat));if(b)filter(cat,b);else render(pins.filter(p=>p.cat===cat));}
function create(){openSheet(`<button class="close" onclick="closeSheet()">إغلاق</button><h2>إنشاء ✨</h2><p style="color:#aaa">النشر متاح للمالك فقط.</p>${window.vkIsOwner&&window.vkIsOwner()?`<h3>نشر من الهاتف</h3><input id="file" class="field" type="file" accept="image/*,video/*,audio/*" onchange="readMedia(event)"><input id="ptitle" class="field" placeholder="عنوان المنشور"><button class="primary" onclick="publishMedia()">📤 نشر فيديو / صورة / صوت</button><div id="uploadInfo" class="result">لم يتم اختيار ملف بعد.</div>`:`<div class="result">👤 حسابك عادي. يمكنك ❤️ الإعجاب و💬 التعليق و🔖 الحفظ والمتابعة، لكن النشر والحذف للمالك فقط.</div>`}`)}
let localImg="";function readImage(e){let r=new FileReader();r.onload=()=>localImg=r.result;r.readAsDataURL(e.target.files[0])}
function publishLocal(){if(!(window.vkIsOwner&&window.vkIsOwner()))return toast("النشر للمالك فقط");if(!localImg)return toast("اختر صورة");pins.unshift({title:document.getElementById("ptitle").value||"منشور جديد",cat:"منشور",img:localImg,likes:0,views:0,liked:false,owner:true});persist();closeSheet();home();toast("تم النشر")}

let newAvatar="";function editProfile(){openSheet(`<button class="close" onclick="closeSheet()">إغلاق</button><h2>تعديل الملف</h2><input id="pn" class="field" value="${esc(profile.name)}"><input id="pb" class="field" type="date" value="${esc(profile.birthDate||"")}"><input class="field" type="file" accept="image/*" onchange="avatarRead(event)"><button class="primary" onclick="saveProfile()">حفظ</button>`)}

/* Vibe King owner/account/engagement controls */
(function(){
 const FOLLOW_KEY='vk_owner_followers';
 let accounts=JSON.parse(localStorage.getItem('vkaccounts')||'null');
 if(!accounts){accounts=[{id:'owner',name:'Vibe King',email:'',birthDate:'',avatar:profile.avatar||'',role:'owner'}];localStorage.setItem('vkaccounts',JSON.stringify(accounts));}
 function saveAccounts(){localStorage.setItem('vkaccounts',JSON.stringify(accounts));}
 function isOwner(){return profile.role==='owner';}
 window.vkIsOwner=isOwner;
 if(!profile.role){profile.role='user';persist();}
 let ownerFollowers=parseInt(localStorage.getItem(FOLLOW_KEY)||'734',10)||734; localStorage.setItem(FOLLOW_KEY,String(ownerFollowers));
 let followedByMe=localStorage.getItem('vk_followed_'+(profile.id||profile.name))==='1';
 function saveFollow(){localStorage.setItem(FOLLOW_KEY,String(ownerFollowers));localStorage.setItem('vk_followed_'+(profile.id||profile.name),followedByMe?'1':'0');}
 function safeUrl(u){return String(u||'').replace(/'/g,'%27').replace(/"/g,'%22');}
 function realIndex(p){return pins.indexOf(p);}
 function incrementView(p){
   if(!p)return false;
   const id=p.id||String(p.title||'pin');
   let seen=[]; try{seen=JSON.parse(sessionStorage.getItem('vk_seen')||'[]')}catch(e){}
   if(seen.includes(id)) return false;
   seen.push(id); sessionStorage.setItem('vk_seen',JSON.stringify(seen));
   p.views=Number(p.views||0)+1; persist(); return true;
 }
 window.followOwner=function(){
   if(isOwner())return toast('أنت المالك بالفعل 👑');
   if(followedByMe){followedByMe=false;ownerFollowers=Math.max(0,ownerFollowers-1);toast('تم إلغاء المتابعة');}
   else{followedByMe=true;ownerFollowers+=1;toast('تمت المتابعة +1 👤');}
   saveFollow(); render(pins);
 };
 function attachViewObserver(){
   const cards=document.querySelectorAll('.pin[data-pin-id]');
   if(!('IntersectionObserver' in window))return;
   const io=new IntersectionObserver(entries=>{entries.forEach(en=>{if(en.isIntersecting && en.intersectionRatio>=.55){let idx=Number(en.target.dataset.pinIndex);if(pins[idx]&&incrementView(pins[idx])){let v=en.target.querySelector('.viewCount');if(v)v.textContent='👁️ '+pins[idx].views;}io.unobserve(en.target);}})},{threshold:.55});
   cards.forEach(c=>io.observe(c));
 }
 window.render=function(list){
   let f=document.getElementById('feed');if(!f)return;
   f.innerHTML=list.length?list.map((p,i)=>{
     let idx=realIndex(p), cid=p.id||String(idx), cc=(comments[cid]||[]).length, sc=saved.includes(cid);
     let media='';
     if(p.type==='video'){
       const src=safeUrl(p.mediaId?(mediaUrls[p.mediaId]||p.src||''):p.src||'');
       media=`<div class="mediaBox"><video src="${src}" controls playsinline preload="metadata" style="width:100%;max-height:560px;object-fit:contain;background:#000;border-radius:16px"></video></div>`;
     }else if(p.type==='pdf'){
       const src=safeUrl(p.mediaId?(mediaUrls[p.mediaId]||p.src||''):p.src||'');
       media=`<div class="mediaBox"><iframe class="pdfFrame" src="${src}"></iframe></div>`;
     }else if(p.type==='image'){
       media=`<div class="mediaBox"><img src="${safeUrl(p.img||fallback(idx))}" onerror="this.src='${fallback(idx)}'" style="width:100%;display:block;max-height:560px;object-fit:contain"></div>`;
     }else if(p.cat==='عبارات'){
       media=`<div class="textCard"><span class="typeBadge">💬 عبارة</span><div class="quoteText">“${esc(p.quote||p.title)}”</div></div>`;
     }else if(p.cat==='كتب'){
       media=`<div class="textCard"><span class="typeBadge">📚 كتاب</span><h3>${esc(p.title)}</h3><div class="bookText">${esc(p.bookText||'افتح الكتاب للقراءة.')}</div></div>`;
     }else if(p.cat==='قصص'){
       media=`<div class="textCard"><span class="typeBadge">📖 قصة</span><h3>${esc(p.title)}</h3><div class="storyText">${esc(p.storyText||'قصة قصيرة داخل Vibe King.')}</div></div>`;
     }
     return `<article class="pin" data-pin-id="${esc(cid)}" data-pin-index="${idx}"><button class="heart" onclick="like(${idx})">♥</button>${media}<div class="meta"><h3>${esc(p.title||'بدون عنوان')}</h3><small>${esc(p.cat||'منشور')} · ❤️ ${Number(p.likes||0)} · 👁️ <span class="viewCount">${Number(p.views||0)}</span></small><div class="countLine">💬 ${cc} تعليق · 🔖 ${sc?'محفوظ':'حفظ'}</div><div style="margin-top:8px"><button class="secondary" onclick="openViewer(${idx})">⛶ فتح ومشاهدة</button> <button class="secondary" onclick="comment(${idx})">💬 ${cc}</button> <button class="secondary" onclick="savePin(${idx})">🔖</button></div></div></article>`;
   }).join(''):'<div style="padding:50px;text-align:center;color:#aaa">لا توجد نتائج.</div>';
   attachViewObserver();
 };
 window.openViewer=function(i){
   let p=pins[i];if(!p)return;incrementView(p);
   const src=safeUrl(p.mediaId?(mediaUrls[p.mediaId]||p.src||''):p.src||'');
   let media='';
   if(p.type==='video') media=`<video id="fullVideo" src="${src}" controls playsinline autoplay style="width:100%;height:100%;max-height:78vh;background:#000;object-fit:contain"></video>`;
   else if(p.type==='pdf') media=`<iframe class="pdfFrame" src="${src}" style="height:72vh"></iframe>`;
   else if(p.type==='image') media=`<div class="zoomWrap"><img id="zoomImg" src="${safeUrl(p.img)}" style="max-width:100%;max-height:72vh;object-fit:contain" data-z="1"></div>`;
   else if(p.cat==='عبارات') media=`<div class="textCard"><div class="quoteText">“${esc(p.quote||p.title)}”</div></div>`;
   else if(p.cat==='كتب') media=`<div class="textCard"><h2>${esc(p.title)}</h2><div class="bookText">${esc(p.bookText||'')}</div></div>`;
   else if(p.cat==='قصص') media=`<div class="textCard"><h2>${esc(p.title)}</h2><div class="storyText">${esc(p.storyText||'')}</div></div>`;
   let zoomBar=p.type==='image'?'<div class="zoombar"><button class="secondary" onclick="zoom(-.15)">−</button><b id="zoomVal">100%</b><button class="secondary" onclick="zoom(.15)">＋</button><button class="secondary" onclick="zoom(0)">↺</button></div>':'';
   let actions='<div class="mediaActions">'+(p.type==='video'?'<button class="primary" onclick="goFullscreen()">⛶ ملء الشاشة</button>':'')+(p.type==='video'||p.type==='image'||p.type==='pdf'?'<button class="downloadBtn" onclick="downloadPin('+i+')">⬇️ تحميل</button>':'')+'</div>';
   let cc=(comments[p.id||i]||[]).length, sc=saved.includes(p.id||String(i));
   let del=isOwner()?'<button class="danger full" onclick="deletePin('+i+');closeSheet();home()">🗑️ حذف المنشور</button>':'';
   openSheet('<button class="close" onclick="closeSheet()">إغلاق</button><h2>'+esc(p.title||'المنشور')+'</h2><div class="viewer">'+media+'</div>'+actions+'<div style="text-align:center;color:#aaa;margin:8px">👁️ '+Number(p.views||0)+' مشاهدة · ❤️ '+Number(p.likes||0)+' إعجاب · 💬 '+cc+' تعليق · 🔖 '+(sc?'محفوظ':'غير محفوظ')+'</div>'+zoomBar+'<div class="mediaActions"><button class="secondary" onclick="comment('+i+')">💬 التعليقات ('+cc+')</button><button class="secondary" onclick="savePin('+i+')">🔖 '+(sc?'إلغاء الحفظ':'حفظ')+'</button></div>'+del);
   if(p.type==='video'){setTimeout(()=>{let sh=document.getElementById('sheet');if(sh)sh.classList.add('video-focus');try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}},80)}
 };
 window.goFullscreen=function(){let v=document.getElementById('fullVideo');if(!v)return;let sh=document.getElementById('sheet');if(sh)sh.classList.add('video-focus');try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}try{if(v.requestFullscreen){let r=v.requestFullscreen();if(r&&r.catch)r.catch(()=>{});}else if(v.webkitEnterFullscreen){v.webkitEnterFullscreen();}else{toast('اقلب الهاتف بالعرض 📱↔️');}}catch(e){toast('اقلب الهاتف بالعرض 📱↔️')}};
 window.downloadPin=async function(i){let p=pins[i];if(!p)return;let src=p.mediaId?(mediaUrls[p.mediaId]||p.src):p.src||p.img;if(!src)return toast('الملف غير متاح الآن');try{let ext=p.type==='video'?'.mp4':p.type==='pdf'?'.pdf':'.jpg';let a=document.createElement('a');a.href=src;a.download=(p.mediaName||p.title||'vibe-king')+ext;a.target='_blank';document.body.appendChild(a);a.click();a.remove();toast('بدأ التحميل ⬇️')}catch(e){window.open(src,'_blank');toast('افتح الملف ثم احفظه')}};
 window.zoom=function(d){let im=document.getElementById('zoomImg');if(!im)return;let z=parseFloat(im.dataset.z||'1');z=d===0?1:Math.max(.4,Math.min(3,z+d));im.dataset.z=z;im.style.transform=`scale(${z})`;im.style.transformOrigin='center top';let v=document.getElementById('zoomVal');if(v)v.textContent=Math.round(z*100)+'%';};
 window.deletePin=function(i){if(!isOwner())return toast('الحذف للمالك فقط');if(!confirm('حذف هذا المنشور؟'))return;let gone=pins.splice(i,1)[0];if(gone&&gone.mediaId)dbDel(gone.mediaId);persist();home();toast('تم حذف المنشور 🗑️');};
 window.create=function(){
   localMedia={type:'',src:'',mediaId:'',name:''};
   if(!isOwner()){openSheet('<button class="close" onclick="closeSheet()">إغلاق</button><h2>إنشاء</h2><div class="result">👤 الحساب العادي لا يستطيع النشر. يمكنك مشاهدة الأفلام وقراءة الكتب والقصص ووضع ❤️ لايك و💬 تعليق و🔖 حفظ.</div>');return;}
   openSheet(`<button class="close" onclick="closeSheet()">إغلاق</button><h2>إنشاء محتوى 🎬</h2><p style="color:#aaa">👑 النشر للمالك فقط. التطبيق مخصص للأفلام والعبارات والكتب والقصص.</p><select id="ptype" class="field"><option value="video">🎬 فيلم / فيديو</option><option value="quote">💬 عبارة</option><option value="book">📚 كتاب / قراءة</option><option value="story">📖 قصة</option><option value="image">🖼️ صورة غلاف</option><option value="pdf">📕 كتاب PDF</option></select><input id="ptitle" class="field" placeholder="العنوان"><textarea id="ptext" class="field" rows="5" placeholder="اكتب العبارة أو القصة أو وصف الكتاب..."></textarea><label class="primary" style="display:block;text-align:center;cursor:pointer">🎬 اختيار فيديو من المعرض<input id="videoFile" type="file" accept="video/*,.mp4,.mov,.m4v,.webm" onchange="readMedia(event)" style="display:none"></label><label class="secondary full" style="display:block;text-align:center;cursor:pointer">🖼️ اختيار صورة من المعرض<input id="imageFile" type="file" accept="image/*" onchange="readMedia(event)" style="display:none"></label><label class="secondary full" style="display:block;text-align:center;cursor:pointer">📕 اختيار كتاب PDF<input id="pdfFile" type="file" accept="application/pdf,.pdf" onchange="readMedia(event)" style="display:none"></label><div id="videoPreview" style="margin-top:10px"></div><div id="uploadInfo" class="result">لم يتم اختيار ملف بعد.</div><button class="primary" onclick="publishMedia()">📤 نشر الآن</button>`);
 };
 window.readMedia=async function(e){let file=e.target.files&&e.target.files[0];if(!file)return;let type=file.type.startsWith('video/')?'video':file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')?'pdf':file.type.startsWith('image/')?'image':'';if(!type)return toast('اختر فيديو أو صورة أو PDF');if(file.size>300*1024*1024)return toast('الملف أكبر من 300MB');try{if(type==='image'){let r=new FileReader();r.onload=()=>{localMedia={type,src:r.result,mediaId:'',name:file.name};let info=document.getElementById('uploadInfo');if(info)info.innerHTML=`✅ ${esc(file.name)}<br><small>🖼️ الصورة جاهزة</small>`};r.readAsDataURL(file)}else{let id=await dbPut(file);let url=URL.createObjectURL(file);mediaUrls[id]=url;localMedia={type,mediaId:id,src:url,name:file.name};let info=document.getElementById('uploadInfo');if(info)info.innerHTML=`✅ ${esc(file.name)}<br><small>${type==='video'?'🎬 الفيديو جاهز للنشر':'📕 الكتاب PDF جاهز للقراءة'}</small>`;if(type==='video'){let pv=document.getElementById('videoPreview');if(pv)pv.innerHTML=`<video src="${url}" controls playsinline preload="metadata" style="width:100%;max-height:300px;border-radius:16px"></video>`}else if(type==='pdf'){let pv=document.getElementById('videoPreview');if(pv)pv.innerHTML=`<iframe class="pdfFrame" src="${url}" style="height:350px;border-radius:16px"></iframe>`}toast('تم اختيار الملف ✓')}}catch(err){console.error(err);toast('تعذر قراءة الملف')}};
 window.publishMedia=function(){if(!isOwner())return toast('النشر للمالك فقط');let type=document.getElementById('ptype')?.value||'video';let title=document.getElementById('ptitle')?.value.trim()||'منشور جديد';let text=document.getElementById('ptext')?.value.trim()||'';if(['video','image','pdf'].includes(type)&&!localMedia.mediaId&&!localMedia.src)return toast('اختر الملف أولًا');if(['quote','book','story'].includes(type)&&!text)return toast('اكتب المحتوى أولًا');let cat=type==='video'?'أفلام':type==='quote'?'عبارات':type==='book'||type==='pdf'?'كتب':'قصص';let pin={id:'p'+Date.now()+Math.random().toString(36).slice(2,7),title,cat,likes:0,views:0,liked:false,owner:true};if(type==='video'||type==='pdf'){pin.type=type;pin.mediaId=localMedia.mediaId;pin.mediaName=localMedia.name;pin.src=mediaUrls[pin.mediaId]||localMedia.src||''}else if(type==='image'){pin.type='image';pin.img=localMedia.src}else if(type==='quote'){pin.quote=text}else if(type==='book'){pin.bookText=text}else if(type==='story'){pin.storyText=text}pins.unshift(pin);persist();localMedia={type:'',src:'',mediaId:'',name:''};closeSheet();home();toast('تم النشر بنجاح 🎉');};
 window.profilePage=function(){openSheet(`<button class="close" onclick="closeSheet()">إغلاق</button><div class="profile"><img class="avatar" src="${profile.avatar||'https://i.pravatar.cc/150?img=12'}"><h2>${esc(profile.name)}</h2><p style="color:#aaa">تاريخ الميلاد: ${esc(profile.birthDate||"غير محدد")}</p><div class="stats"><div><b>${pins.filter(p=>p.owner).length}</b>منشوراتي</div><div><b>${ownerFollowers}</b>متابع</div><div><b>196</b>أتابع</div></div>${!isOwner()?`<button class="followBtn" onclick="followOwner()">${followedByMe?'✓ متابع':'＋ متابعة Vibe King'}</button>`:''}<button class="primary" onclick="editProfile()">تعديل الملف</button><button class="secondary full" onclick="accountManager()">👤 الحساب</button></div>`);};
 window.accountManager=function(){openSheet(`<button class="close" onclick="closeSheet()">إغلاق</button><h2>الحساب 👤</h2><div class="result">هذا الحساب يعتمد على اسمك وتاريخ ميلادك فقط. لا يوجد إيميل أو كلمة مرور.</div><p style="color:#aaa">الاسم: <b>${esc(profile.name)}</b><br>تاريخ الميلاد: <b>${esc(profile.birthDate||"غير محدد")}</b></p><button class="primary" onclick="closeSheet();document.getElementById("authGate").classList.remove("hidden");document.getElementById("authName").value="";document.getElementById("authBirth").value="";showAuthError("authError1","")">إنشاء حساب آخر</button></div>`);};
